name: mediguard
description: "MediCue - Smart Medicine Reminder & Caregiver App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/doseiq_logo.png
    - assets/images/medicue_logo.png
    - assets/images/medicue_mascot.png
    - assets/images/medicue_bottle.png
    - assets/images/medicue_bottle_sparks.png
    - assets/images/medicue_medi.png
    - assets/images/medicue_cue.png
    - assets/images/medicue_capsule.png
    - assets/images/medicue_cue_sparks.png
    - assets/images/medicue_swoosh.png
